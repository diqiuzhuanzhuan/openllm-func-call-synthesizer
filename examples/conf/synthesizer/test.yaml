# settings controlling the synthesizer behaviour
name: "default_synthesizer"

mcp_servers:
  "ugreen_mcp":
    transport: "http://localhost:8000/mcp"

choose_part_tools: false # ["search_photos", "create_album"]

query_generation:
  enable: True
  function_docs: examples/function_docs.json

  languages:
    - English
    - Chinese
    - Japanese
    - German

  name: "tool_query"
  output_dir: "data"
  output_format: "jsonl"   # or "json", "csv", "parquet"

  providers:
    openai:
      backend: "openai"
      models:
        - "gpt-4o"
        - "gpt-4o-mini"
        - "gpt-4.1"
        - "gpt-5-mini"
      backend_params:
        max_tokens_per_minute: 1_000_000
        require_all_responses: False

  # anthropic:
  #    backend: "litellm"
  #    models:
  #      - "anthropic/claude-sonnet-4-5-20250929"
  #    backend_params:
  #      max_tokens_per_minute: 1_000_000
  #      require_all_responses: False

    # ollama:
    #   backend: "litellm"
    #   models:
    #     - "ollama_chat/qwen3-1.7b"
    #   backend_params:
    #     max_tokens_per_minute: 1_000_000
    #     require_all_responses: False

    google:
      backend: "openai"
      models:
        - "gemini-2.5-pro-nothinking"
        - "gemini-2.5-flash-thinking"
      backend_params:
        max_tokens_per_minute: 1_000_000
        require_all_responses: False

function_call_generation:
  enable: True
  function_dataset: "data/tool_query" #data set generated by query_generation
  max_num: -1 # max number of function calls to generate, -1 means all
  output_dir: "data"
  output_format: "jsonl"   # or "json", "csv", "parquet"
  name: "function_call_gpt_4o"
  provider:
    model_name: "gpt-4o"
    backend: "openai"
    backend_params:
      require_all_responses: False
      max_tokens_per_minute: 8_000_000
    generation_params:
      max_tokens: 4096
      stream: False


conversation_generation:
  enable: False
  query_dataset: "data/tool_query"  # dataset produced by query_generation
  max_num: -1  # -1 means all queries
  max_iterations: 8  # max LLM calls per conversation before stopping
  system_prompt: >
    You are a helpful assistant.
  output_dir: "data"
  name: "conversation_gpt_4o_mini"
  provider:
    model_name: "gpt-4o-mini"

critic:
  enable: False
  backend_type: "deepeval"
  function_call_dataset: "data/function_call_gpt_4o"
  output_dir: "data"
  # cirtic need 'query', 'label', 'task_prompt'
  query_field: "query"
  task_prompt_field: "prompt"
  label_field: "function_call"
  functions_field: "functions"
  response_field: "answer"
  output_format: "jsonl"   # or "json", "csv", "parquet"
  use_ground_truth: False # if True, ground_truth field is required
  threshold: 0.5
  async_config:
    run_async: True
    max_concurrent: 20
    throttle_value: 0
  name: "function_call_gpt_4o_critiqued_by_deepeval"
  provider:
    model_name: "gpt-5-mini-2025-08-07"
    backend: "openai"
    backend_params:
      require_all_responses: False
      max_tokens_per_minute: 3_000_000


llama_factory:
  # required fields： answer， query， functions
  enable: False
  critic_dataset: "data/function_call_gpt_4o_critiqued_by_deepeval"
  output_dir: "data"
  output_format: "jsonl"   # or "json", "csv", xlsx, "parquet"
  name: "function_call_gpt_4o_critiqued_by_deepeval_llama_factory"
  split_ratio: -1
  score_field: "score"
  score_threshold: 0.8
  system_prompt: "You are a helpful assistant."


verl:
  enable: False
  critic_dataset: "data/function_call_gpt_4o_critiqued_by_deepeval"
  output_dir: "data"
  output_format: "jsonl"
  name: "function_call_gpt_4o_critiqued_by_deepeval_verl"
  split_ratio: 0.85
  score_field: "score"
  score_threshold: 0.8
  system_prompt: "You are a helpful assistant."
